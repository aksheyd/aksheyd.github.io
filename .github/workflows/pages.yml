name: pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v7
      - run: node build.mjs
      - run: |
          mkdir -p site/blog
          cp index.html style.css robots.txt sitemap.xml site/
          cp blog/*.html site/blog/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v4
